serial:
  port: COM5
  baudrate: 115200
  timeout_s: 2.0
  inter_byte_timeout_s: 0.1
reader:
  region: 8
  boot_timeout_ms: 3000
  response_timeout_ms: 2000
  max_power_dbm: 30
# Montaggio del prototipo: tutte e tre le antenne a pavimento.
# 1 e 2 affiancate, con il contenitore appoggiato sopra: sono quelle di lettura.
# 3 poco distante, per scrivere i tag uno alla volta.
#
# I ruoli sono descrittivi e il driver non li usa: l'identita' dell'antenna e'
# il suo id. Servono a chi legge la configurazione fra sei mesi.
#
# Nota sul limite di questo montaggio: tre antenne complanari non danno
# discriminazione in altezza, quindi il consenso geometrico di `lims.sealing`
# (`min_antennas`) distingue meno bene un tag dentro il volume da uno appoggiato
# accanto. Con la terza antenna in verticale il criterio diventerebbe piu' netto.
antennas:
- id: 1
  role: floor_read_left
  read_power: 2900
  write_power: 2000
- id: 2
  role: floor_read_right
  read_power: 2900
  write_power: 2000
- id: 3
  role: floor_write_station
  read_power: 2000
  write_power: 2000
geometry:
  antenna_hpbw_deg: 68
  antenna_gain_dbi: 8
  antenna_size_mm:
  - 220
  - 220
  - 24
  # Volume di lettura dichiarato: ingombro del contenitore appoggiato sulle due
  # antenne di lettura. Non entra nei calcoli, ma viene riportato nel report
  # della campagna di misura: un risultato senza le dimensioni a cui si
  # riferisce non e' confrontabile con un'altra installazione.
  volume_mm:
  - 440
  - 220
  - 220
  # Posizione reale delle antenne, in millimetri. Origine al centro della coppia
  # di lettura; X verso destra, Y in profondita', Z verso l'alto.
  #
  # Serve al frontend per disegnare il banco com'e' davvero. Non e' un dettaglio
  # estetico: un'animazione che mostra un'antenna verticale dove non c'e'
  # istruirebbe male l'operatore. Se il montaggio cambia, si cambia qui.
  antenna_positions_mm:
  - id: 1
    center: [-110, 0, 0]
    normal: [0, 0, 1]      # a pavimento, rivolta verso l'alto
  - id: 2
    center: [110, 0, 0]
    normal: [0, 0, 1]
  - id: 3
    center: [520, 0, 0]    # postazione di scrittura, staccata dalle altre
    normal: [0, 0, 1]
inventory:
  antennas:
  - 1
  - 2
  timeout_ms: 1000
  metadata_flags: 7
  duration_s: 30.0
  max_unique_epcs: 1000
  stop_after_consecutive_errors: 3
  presence_mode: missed_cycles
  presence_threshold: 2
tag_access:
  bank_reserved: 0
  bank_epc: 1
  bank_tid: 2
  bank_user: 3
  access_password_hex: '00000000'
  timeout_ms: 1000
  write_data_hex: '12345678'
  read_user_words: 2
  auto_epc_bytes: 12
  auto_epc_prefix_hex: ''
  barcode_verify_attempts: 3
# Anagrafica di questo laboratorio: quello che effettua l'accettazione.
# Compare in alto nell'interfaccia, sulle etichette e nella distinta.
laboratorio:
  nome: ''
  # Sigla breve mostrata in alto quando il nome per esteso non ci sta.
  codice: ''
  indirizzo: ''
  cap: ''
  citta: ''
  provincia: ''
  telefono: ''
  # Email del laboratorio e del referente: la seconda e' quella da cui parte la
  # distinta verso il destinatario.
  email: ''
  referente: ''
  email_referente: ''
# Operatori abilitati. Nell'interfaccia si sceglie da un elenco, non si digita:
# un nome scritto a mano ogni volta diverso rende il registro inutilizzabile.
# Viene mostrato `codice` se c'e', altrimenti il cognome.
operatori: []
# - codice: DV
#   cognome: Venturi
#   nome: Daniele
#   email: ''
#   attivo: true
# Laboratori destinatari. Riempiono il menu a tendina del sigillo, e la loro
# email serve a preparare il messaggio con cui si spedisce la distinta.
destinatari: []
# - nome: Anatomia patologica - Ospedale B
#   codice: AP-B
#   email: anatomia@ospedaleb.it
#   referente: ''
#   indirizzo: ''
#   citta: ''
#   attivo: true
# Tracciabilita' dei campioni (pacchetto src/lims/).
# Vedi docs/SCHEMA_DATI_TAG.md per il significato dei campi.
lims:
  # Identificativo di questo laboratorio: finisce nell'EPC di ogni contenitore.
  lab_id: 1
  # Archivio pazienti/reperti/contenitori e registro di unicita' degli EPC.
  database: logs/lims.db
  # Portachiavi delle chiavi condivise con i laboratori destinatari.
  # NON versionare questo file e proteggere la cartella che lo contiene.
  keyring: logs/lims_keys.json
  # Byte di USER memory dei tag in uso. Va impostato con il valore MISURATO da
  # `python run.py tag-profile`, non con quello dedotto dal datasheet.
  user_memory_bytes: 64
  # Postazione di scrittura: antenna 3, distante dalle altre, un contenitore per
  # volta. Senza filtro Select il comando colpisce il primo tag che risponde;
  # con `lims.tagio` che ora usa il Select la distanza resta comunque la difesa
  # piu' semplice contro le scritture sul contenitore sbagliato.
  write_antennas: [3]
  # Antenne del volume di lettura: le due a pavimento sotto il contenitore.
  read_antennas: [1, 2]
  # Sigillo della scatola: quante antenne distinte devono aver visto un tag
  # perche' sia considerato dentro. Con antenne complanari il criterio e' debole:
  # va alzato solo dopo la campagna di misura, e solo se i dati lo giustificano.
  seal_min_antennas: 1
  # Potenze provate dal sigillo, dalla piu' bassa: la piu' bassa che legge tutto
  # e' anche quella che legge meno di quello che sta fuori.
  seal_powers_cdbm: [2000, 2500, 2900]
  # Nome del laboratorio stampato sulle etichette.
  lab_name: ''
  # Etichette dei contenitori (ZPL). `printer_host` vuoto = nessuna stampante
  # configurata: l'interfaccia mostra l'anteprima e lo ZPL, ma non stampa.
  label:
    width_mm: 50
    height_mm: 30
    dpi: 203
    copies: 1
    printer_host: ''
    printer_port: 9100
# Interfaccia web locale (`python run.py webui`).
webui:
  # Solo l'interfaccia di loopback: l'hardware non deve essere raggiungibile
  # dalla rete del laboratorio.
  host: 127.0.0.1
  port: 8770
  # Apre il browser da solo all'avvio, con il token di sessione nell'indirizzo.
  open_browser: true
  # Token fisso, opzionale. Vuoto = ne viene generato uno nuovo a ogni avvio
  # (piu' sicuro, ma l'indirizzo cambia ogni volta). Scrivendo qui una stringa
  # lunga e non indovinabile, l'indirizzo resta sempre lo stesso e si puo'
  # salvare come collegamento sul desktop: comodo su una postazione dedicata.
  # NON usare parole comuni: chiunque sulla macchina che indovini il token puo'
  # usare il lettore.
  token: ''
  # Tema iniziale: chiaro | scuro | sistema
  theme: sistema
  # Ogni quanto la postazione di scrittura interroga il piatto per accorgersi
  # che il contenitore e' stato appoggiato.
  watch_interval_ms: 900
logging:
  dir: logs
  level: INFO
