name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installa progetto e strumenti
        run: python -m pip install -e ".[dev]" -r requirements-qr.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint
        run: python -m ruff check src run.py
      - name: Test runner integrato
        run: python run.py tests
      - name: Pytest e coverage
        run: python -m pytest
      - name: Test interfacce webcam e scambio distinte
        shell: bash
        run: |
          for test in src/tests/test_*_ui.cjs; do
            node "$test" || exit 1
          done
